services:

  apiserver:
    build:
      dockerfile: Dockerfile
    depends_on:
      - mongodb
    restart: always
    ports:
      - "20000:8001"
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./:/ayame
    command: ["fastapi", "run", "main.py", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers"]
    logging:
     driver: "json-file"
     options:
       max-size: "1m"
       max-file: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/" ]
      interval: 30s
      timeout: 5s
      retries: 5
  
  mongodb:
    image: mongo
    restart: always
    environment:
      -  'MONGODB_USER=user' 
      -  'MONGODB_PASS=password'
    volumes:
      -  ./mongodb:/data/db

    command: 
      - --wiredTigerCollectionBlockCompressor
      - zstd


  mongo-express:
    ports:
      - "20001:8081"
    environment:
      - ME_CONFIG_OPTIONS_EDITORTHEME=ambiance
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=user
      - ME_CONFIG_BASICAUTH_PASSWORD=password
    image: mongo-express
    restart: always
    